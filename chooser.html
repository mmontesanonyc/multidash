<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Data Summary Table</title>

<link rel="stylesheet"
      href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #ffffff;
    color: #1c2b3a;
  }


  /* ============================================================
     TOP BAR
     ============================================================ */

  .topbar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background-color: #000000;
    color: #dde3ea;
    padding: 0.9rem 1.25rem;
    flex-shrink: 0;
  }

  .topbar-icon {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .topbar-title {
    margin: 0;
    font-size: 1.1rem;
    font-weight: bold;
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 0.02em;
  }


  /* ============================================================
     PAGE
     ============================================================ */

  .table-wrap {
    padding: 24px;
    min-height: 100vh;
  }

  h1 {
    margin: 0 0 4px 0;
    color: #0a2c5c;
    font-size: 1.3rem;
  }

  .subtitle {
    margin: 0 0 18px 0;
    font-size: 0.9rem;
    color: #5a6a7a;
  }


  /* ============================================================
     MAIN TWO-COLUMN LAYOUT
     ============================================================ */

  .content-layout {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }


  /* ============================================================
     LEFT FILTER COLUMN
     ============================================================ */

  .filter-column {
    min-width: 0;
  }

  .filter-column__title {
    margin: 0 0 10px 0;
    color: #0a2c5c;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .filter-panel {
    min-width: 0;
    margin-bottom: 16px;
    border: 1px solid #d7dce3;
    border-radius: 6px;
    background: #ffffff;
    overflow: hidden;
  }

  .filter-panel:last-child {
    margin-bottom: 0;
  }

  .filter-panel__header {
    padding: 9px 12px;
    background: #f7f9fb;
    border-bottom: 1px solid #d7dce3;
    color: #1c2b3a;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }


  /* Selected filter value */

  .filter-selected {
    min-height: 42px;
    display: flex;
    align-items: center;
    padding: 6px 10px;
    border-bottom: 1px solid #e5e8ec;
    background: #ffffff;
  }

  .filter-selected.is-empty {
    color: #8a96a3;
    font-size: 0.78rem;
  }


  /* Scrollable filter options */

  .filter-options {
    max-height: 220px;
    overflow-y: auto;
    padding: 7px;
  }

  .filter-option {
    display: block;
    width: 100%;
    margin: 0;
    padding: 6px 9px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #1c2b3a;
    text-align: left;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .filter-option:hover {
    background-color: #eef1f5;
  }

  .filter-option.selected {
    display: none;
  }

  .filter-option:focus-visible {
    outline: 2px solid #7fd6ff;
    outline-offset: -2px;
  }


  /* Selected filter pill */

  .filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 100%;
    background-color: #0a2c5c;
    color: #ffffff;
    border: 1px solid #0a2c5c;
    border-radius: 999px;
    padding: 5px 10px 5px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.2;
  }

  .filter-pill > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .filter-pill__close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    border: 0;
    padding: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
  }

  .filter-pill__close:hover {
    background: rgba(255, 255, 255, 0.32);
  }


  /* ============================================================
     RIGHT TABLE COLUMN
     ============================================================ */

  .table-column {
    min-width: 0;
  }

  #load-status {
    font-size: 0.85rem;
    color: #5a6a7a;
    margin-bottom: 10px;
  }

  #load-status.error {
    color: #a33;
  }


  /* ============================================================
     DATATABLE
     ============================================================ */

  table.dataTable {
    border-collapse: collapse !important;
    width: 100% !important;
    font-size: 0.85rem;
  }

  table.dataTable thead th {
    background-color: #0a2c5c;
    color: #ffffff;
    border-bottom: none !important;
    white-space: nowrap;
  }

  table.dataTable tbody tr:nth-child(even) {
    background-color: #f7f9fb;
  }

  table.dataTable tbody td {
    white-space: nowrap;
    vertical-align: middle;
  }


  /* ============================================================
     INDICATOR CELL
     ============================================================ */

  .indicator-cell {
    min-width: 280px;
    white-space: normal;
    line-height: 1.25;
  }

  .indicator-cell__name {
    font-weight: 700;
    color: #1c2b3a;
  }

  .indicator-cell__meta {
    margin-top: 3px;
    color: #7a8794;
    font-size: 0.74rem;
    font-weight: 400;
  }


  /* ============================================================
     WARNING
     ============================================================ */

  #spec-warning {
    display: none;
    font-size: 0.85rem;
    background-color: #fdf1d8;
    border: 1px solid #f0d99a;
    color: #5c4108;
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }

  #spec-warning.visible {
    display: block;
  }


  /* ============================================================
     RESPONSIVE
     ============================================================ */

  @media (max-width: 800px) {

    .content-layout {
      grid-template-columns: 1fr;
    }

    .filter-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .filter-column__title {
      grid-column: 1 / -1;
      margin-bottom: -6px;
    }

    .filter-panel {
      margin-bottom: 0;
    }

  }

  @media (max-width: 550px) {

    .table-wrap {
      padding: 16px;
    }

    .filter-column {
      display: block;
    }

    .filter-column__title {
      margin-bottom: 10px;
    }

    .filter-panel {
      margin-bottom: 16px;
    }

  }
</style>
</head>


<body>


  <!-- ==========================================================
       TOP BAR
       ========================================================== -->

  <div class="topbar">

    <span class="topbar-icon">

      <svg width="22"
           height="22"
           viewBox="0 0 24 24"
           fill="none"
           xmlns="http://www.w3.org/2000/svg">

        <rect x="2"
              y="2"
              width="20"
              height="20"
              rx="4"
              fill="#0a2c5c"/>

        <path d="M6 15L10 10.5L13 13L18 7"
              stroke="#7fd6ff"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"/>

        <circle cx="6"
                cy="15"
                r="1.3"
                fill="#7fd6ff"/>

        <circle cx="10"
                cy="10.5"
                r="1.3"
                fill="#7fd6ff"/>

        <circle cx="13"
                cy="13"
                r="1.3"
                fill="#7fd6ff"/>

        <circle cx="18"
                cy="7"
                r="1.3"
                fill="#7fd6ff"/>

      </svg>

    </span>

    <h2 class="topbar-title">
      PHISS2.0
    </h2>

  </div>


  <!-- ==========================================================
       PAGE CONTENT
       ========================================================== -->

  <div class="table-wrap">

    <p class="subtitle">
      Loaded from mock-data-summary.csv
    </p>


    <div id="spec-warning"></div>


    <!-- ========================================================
         TWO-COLUMN CONTENT LAYOUT
         ======================================================== -->

    <div class="content-layout">


      <!-- ======================================================
           LEFT: FILTERS
           ====================================================== -->

      <aside class="filter-column">

        <h3 class="filter-column__title">
          Filter results
        </h3>


        <!-- Subcategory filter -->

        <div class="filter-panel">

          <div class="filter-panel__header">
            Subcategory
          </div>

          <div id="subcat-selected"
               class="filter-selected is-empty">
            No subcategory selected
          </div>

          <div id="subcat-options"
               class="filter-options">
          </div>

        </div>


        <!-- Frequency filter -->

        <div class="filter-panel">

          <div class="filter-panel__header">
            Frequency
          </div>

          <div id="frequency-selected"
               class="filter-selected is-empty">
            No frequency selected
          </div>

          <div id="frequency-options"
               class="filter-options">
          </div>

        </div>

      </aside>


      <!-- ======================================================
           RIGHT: TABLE
           ====================================================== -->

      <main class="table-column">

        <div id="load-status">
          Loading mock-data-summary.csv&hellip;
        </div>

        <table id="summary-table"
               class="display"
               style="width:100%">
        </table>

      </main>


    </div>

  </div>


  <!-- ==========================================================
       JAVASCRIPT LIBRARIES
       ========================================================== -->

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>


  <script>

    // ============================================================
    // COLUMN DISPLAY SPEC
    // ============================================================

    const COLUMN_DISPLAY_SPEC = [

      'Indicator',

      'Previous Value',

      'Current Value',

      'Current vs Previous Delta (%)',

    ];


    // ============================================================
    // FILTER FIELDS
    // ============================================================

    const FILTER_FIELDS = {

      subcategory: 'Subcategory',

      frequency: 'Frequency'

    };


    // ============================================================
    // DOM REFERENCES
    // ============================================================

    const statusEl =
      document.getElementById('load-status');

    const warningEl =
      document.getElementById('spec-warning');

    const subcatSelectedEl =
      document.getElementById('subcat-selected');

    const subcatOptionsEl =
      document.getElementById('subcat-options');

    const frequencySelectedEl =
      document.getElementById('frequency-selected');

    const frequencyOptionsEl =
      document.getElementById('frequency-options');


    // ============================================================
    // TABLE / FILTER STATE
    // ============================================================

    let table = null;

    let selectedSubcategory = null;

    let selectedFrequency = null;

    let subcatColumnIndex = null;

    let frequencyColumnIndex = null;

    let percentChangeColumnIndex = null;


    // ============================================================
    // HEADER NORMALIZATION
    // ============================================================

    function normalizeHeader(name) {

      return name
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase();

    }


    // ============================================================
    // PARSE PERCENT VALUE
    // ============================================================

    function parsePercentValue(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return null;
      }

      const numeric = parseFloat(

        String(value)
          .replace(/,/g, '')
          .replace('%', '')
          .trim()

      );

      return isNaN(numeric)
        ? null
        : numeric;

    }


    // ============================================================
    // DATATABLES ABSOLUTE-VALUE SORTING
    // ============================================================

    $.fn.dataTable.ext.type.order[
      'absolute-percent-pre'
    ] = function (data) {

      const value =
        parsePercentValue(data);

      if (value === null) {
        return -Infinity;
      }

      return Math.abs(value);

    };


    // ============================================================
    // APPLY FILTERS
    // ============================================================

    function applyFilters() {

      if (!table) {
        return;
      }


      // ----------------------------------------------------------
      // Subcategory
      // ----------------------------------------------------------

      if (
        subcatColumnIndex !== null &&
        selectedSubcategory
      ) {

        const escaped =
          $.fn.dataTable.util.escapeRegex(
            selectedSubcategory
          );

        table
          .column(subcatColumnIndex)
          .search(
            '^' + escaped + '$',
            true,
            false
          );

      } else if (
        subcatColumnIndex !== null
      ) {

        table
          .column(subcatColumnIndex)
          .search('');

      }


      // ----------------------------------------------------------
      // Frequency
      // ----------------------------------------------------------

      if (
        frequencyColumnIndex !== null &&
        selectedFrequency
      ) {

        const escaped =
          $.fn.dataTable.util.escapeRegex(
            selectedFrequency
          );

        table
          .column(frequencyColumnIndex)
          .search(
            '^' + escaped + '$',
            true,
            false
          );

      } else if (
        frequencyColumnIndex !== null
      ) {

        table
          .column(frequencyColumnIndex)
          .search('');

      }


      table.draw();

    }


    // ============================================================
    // RENDER SELECTED FILTER
    // ============================================================

    function renderSelectedFilter(
      selectedValue,
      selectedEl,
      emptyText,
      onClear
    ) {

      selectedEl.innerHTML = '';


      if (!selectedValue) {

        selectedEl.classList.add(
          'is-empty'
        );

        selectedEl.textContent =
          emptyText;

        return;

      }


      selectedEl.classList.remove(
        'is-empty'
      );


      const pill =
        document.createElement('span');

      pill.className =
        'filter-pill';


      const label =
        document.createElement('span');

      label.textContent =
        selectedValue;


      const close =
        document.createElement('button');

      close.type = 'button';

      close.className =
        'filter-pill__close';

      close.setAttribute(
        'aria-label',
        'Clear filter'
      );

      close.innerHTML =
        '&times;';


      close.addEventListener(
        'click',
        function () {
          onClear();
        }
      );


      pill.appendChild(label);

      pill.appendChild(close);

      selectedEl.appendChild(pill);

    }


    // ============================================================
    // RENDER FILTER OPTIONS
    // ============================================================

    function renderFilterOptions(
      values,
      optionsEl,
      selectedValue,
      onSelect
    ) {

      optionsEl.innerHTML = '';


      values.forEach(function (value) {

        const button =
          document.createElement('button');

        button.type = 'button';

        button.className =
          'filter-option';


        if (value === selectedValue) {

          button.classList.add(
            'selected'
          );

        }


        button.textContent =
          value;


        button.addEventListener(
          'click',
          function () {

            onSelect(value);

          }
        );


        optionsEl.appendChild(
          button
        );

      });

    }


    // ============================================================
    // BUILD FILTER
    // ============================================================

    function buildFilter(
      values,
      optionsEl,
      selectedEl,
      emptyText,
      getSelected,
      setSelected
    ) {

      function render() {

        const currentValue =
          getSelected();


        renderSelectedFilter(

          currentValue,

          selectedEl,

          emptyText,

          function () {

            setSelected(null);

            render();

            applyFilters();

          }

        );


        renderFilterOptions(

          values,

          optionsEl,

          currentValue,

          function (value) {

            setSelected(value);

            render();

            applyFilters();

          }

        );

      }


      render();

    }


    // ============================================================
    // ESCAPE HTML
    // ============================================================

    function escapeHtml(value) {

      return String(
        value == null ? '' : value
      )
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    // ============================================================
    // LOAD CSV
    // ============================================================

    Papa.parse(
      'mock-data-summary.csv',
      {

        download: true,

        header: true,

        skipEmptyLines: true,


        complete: function (results) {


          // ------------------------------------------------------
          // Validate CSV
          // ------------------------------------------------------

          if (
            !results.data.length ||
            !results.meta.fields ||
            !results.meta.fields.length
          ) {

            statusEl.textContent =
              'mock-data-summary.csv loaded, but no rows were found.';

            statusEl.classList.add(
              'error'
            );

            return;

          }


          const csvFields =
            results.meta.fields;


          // ------------------------------------------------------
          // Normalized header lookup
          // ------------------------------------------------------

          const normalizedToActual = {};


          csvFields.forEach(
            function (field) {

              normalizedToActual[
                normalizeHeader(field)
              ] = field;

            }
          );


          // ------------------------------------------------------
          // Filter fields
          // ------------------------------------------------------

          const subcatField =
            normalizedToActual[
              normalizeHeader(
                FILTER_FIELDS.subcategory
              )
            ];


          const frequencyField =
            normalizedToActual[
              normalizeHeader(
                FILTER_FIELDS.frequency
              )
            ];


          // ------------------------------------------------------
          // Table columns
          // ------------------------------------------------------

          const matchedColumns = [];

          const unmatchedSpecEntries = [];


          COLUMN_DISPLAY_SPEC.forEach(
            function (specName) {


              const actualField =
                normalizedToActual[
                  normalizeHeader(specName)
                ];


              if (!actualField) {

                unmatchedSpecEntries.push(
                  specName
                );

                return;

              }


              // --------------------------------------------------
              // Indicator
              // --------------------------------------------------

              if (
                specName === 'Indicator'
              ) {

                matchedColumns.push({

                  title: 'Indicator',

                  data: actualField,


                  render: function (
                    data,
                    type,
                    row
                  ) {


                    if (
                      type !== 'display'
                    ) {

                      return data || '';

                    }


                    const sourceField =
                      normalizedToActual[
                        normalizeHeader(
                          'Source'
                        )
                      ];


                    const dateField =
                      normalizedToActual[
                        normalizeHeader(
                          'Current Value Date'
                        )
                      ];


                    const source =
                      sourceField
                        ? row[sourceField] || ''
                        : '';


                    const updated =
                      dateField
                        ? row[dateField] || ''
                        : '';


                    return `

                      <div class="indicator-cell">

                        <div class="indicator-cell__name">
                          ${escapeHtml(data || '')}
                        </div>

                        <div class="indicator-cell__meta">
                          Source: ${escapeHtml(source)},
                          Updated: ${escapeHtml(updated)}
                        </div>

                      </div>

                    `;

                  }

                });


                return;

              }


              // --------------------------------------------------
              // Percent Change
              // --------------------------------------------------

              if (
                specName ===
                'Current vs Previous Delta (%)'
              ) {

                percentChangeColumnIndex =
                  matchedColumns.length;


                matchedColumns.push({

                  title: 'Percent change',

                  data: actualField,

                  type: 'absolute-percent',


                  render: function (
                    data,
                    type
                  ) {

                    if (
                      type === 'display'
                    ) {

                      return data || '';

                    }

                    return data || '';

                  }

                });


                return;

              }


              // --------------------------------------------------
              // Other columns
              // --------------------------------------------------

              matchedColumns.push({

                title: specName,

                data: actualField

              });

            }
          );


          // ------------------------------------------------------
          // Hidden Subcategory column
          // ------------------------------------------------------

          if (subcatField) {

            subcatColumnIndex =
              matchedColumns.length;


            matchedColumns.push({

              title: 'Subcategory',

              data: subcatField,

              visible: false,

              searchable: true

            });

          } else {

            unmatchedSpecEntries.push(
              FILTER_FIELDS.subcategory +
              ' (filter)'
            );

          }


          // ------------------------------------------------------
          // Hidden Frequency column
          // ------------------------------------------------------

          if (frequencyField) {

            frequencyColumnIndex =
              matchedColumns.length;


            matchedColumns.push({

              title: 'Frequency',

              data: frequencyField,

              visible: false,

              searchable: true

            });

          } else {

            unmatchedSpecEntries.push(
              FILTER_FIELDS.frequency +
              ' (filter)'
            );

          }


          // ------------------------------------------------------
          // Warning
          // ------------------------------------------------------

          if (
            unmatchedSpecEntries.length
          ) {

            warningEl.textContent =
              'Warning: these columns were not found in the CSV header: ' +
              unmatchedSpecEntries.join(', ');

            warningEl.classList.add(
              'visible'
            );

          }


          // ------------------------------------------------------
          // Validate table columns
          // ------------------------------------------------------

          if (!matchedColumns.length) {

            statusEl.textContent =
              'None of the columns in COLUMN_DISPLAY_SPEC matched the CSV header.';

            statusEl.classList.add(
              'error'
            );

            return;

          }


          // ======================================================
          // INITIALIZE DATATABLE
          // ======================================================

          table =
            $('#summary-table').DataTable({

              data: results.data,

              columns: matchedColumns,

              deferRender: true,

              scrollX: true,


              /*
               * No pagination.
               */

              paging: false,

              lengthChange: false,

              info: false,


              /*
               * Default order:
               * largest absolute Percent Change first.
               */

              order: [

                [
                  percentChangeColumnIndex,
                  'desc'
                ]

              ]

            });


          statusEl.style.display =
            'none';


          // ======================================================
          // SUBCATEGORY FILTER
          // ======================================================

          if (subcatField) {

            const values =
              Array.from(

                new Set(

                  results.data

                    .map(
                      function (row) {

                        return (
                          row[subcatField] || ''
                        ).trim();

                      }
                    )

                    .filter(
                      function (value) {

                        return value.length > 0;

                      }
                    )

                )

              ).sort(
                function (a, b) {

                  return a.localeCompare(b);

                }
              );


            buildFilter(

              values,

              subcatOptionsEl,

              subcatSelectedEl,

              'No subcategory selected',

              function () {

                return selectedSubcategory;

              },

              function (value) {

                selectedSubcategory =
                  value;

              }

            );

          }


          // ======================================================
          // FREQUENCY FILTER
          // ======================================================

          if (frequencyField) {

            const values =
              Array.from(

                new Set(

                  results.data

                    .map(
                      function (row) {

                        return (
                          row[frequencyField] || ''
                        ).trim();

                      }
                    )

                    .filter(
                      function (value) {

                        return value.length > 0;

                      }
                    )

                )

              ).sort(
                function (a, b) {

                  return a.localeCompare(b);

                }
              );


            buildFilter(

              values,

              frequencyOptionsEl,

              frequencySelectedEl,

              'No frequency selected',

              function () {

                return selectedFrequency;

              },

              function (value) {

                selectedFrequency =
                  value;

              }

            );

          }

        },


        // ========================================================
        // CSV ERROR
        // ========================================================

        error: function (err) {

          statusEl.textContent =
            'Could not load mock-data-summary.csv: ' +
            err.message;

          statusEl.classList.add(
            'error'
          );

        }

      }
    );

  </script>

</body>
</html>
