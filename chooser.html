<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mock Data Summary Table</title>

<link rel="stylesheet"
      href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

<style>
  /* ============================================================
     GLOBAL
     ============================================================ */

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #ffffff;
    color: #1c2b3a;
  }


  /* ============================================================
     TOP BAR
     ============================================================ */

  .topbar {
    height: 52px;
    min-height: 52px;

    display: flex;
    align-items: center;

    gap: 0.6rem;

    background-color: #000000;
    color: #dde3ea;

    padding: 0 1.25rem;

    flex-shrink: 0;
  }

  .topbar-icon {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .topbar-title {
    margin: 0;

    font-size: 1.1rem;
    font-weight: bold;

    font-family: "Courier New", Courier, monospace;

    letter-spacing: 0.02em;
  }

  .pale {
    border: .25px solid lightgray;
  }


  /* ============================================================
     PAGE BODY

     Everything below the topbar fits into the remaining
     viewport height.
     ============================================================ */

  .table-wrap {
    height: calc(100vh - 52px);

    padding: 16px 24px;

    display: flex;
    flex-direction: column;

    min-height: 0;
    overflow: hidden;
  }


  /* ============================================================
     PAGE INTRO / STATUS AREA
     ============================================================ */

  h1 {
    margin: 0 0 3px 0;

    color: #0a2c5c;

    font-size: 1.3rem;
  }

  .subtitle {
    margin: 0 0 10px 0;

    font-size: 0.85rem;

    color: #5a6a7a;

    flex-shrink: 0;
  }


  /* ============================================================
     MAIN TWO-COLUMN LAYOUT

     This occupies all remaining vertical space.
     ============================================================ */

  .content-layout {
    display: grid;

    grid-template-columns: 220px minmax(0, 1fr);

    gap: 18px;

    flex: 1 1 auto;

    min-height: 0;

    align-items: stretch;
  }


  /* ============================================================
     LEFT FILTER COLUMN

     Sidebar itself does not scroll with the table.
     ============================================================ */

  .filter-column {
    min-width: 0;
    min-height: 0;

    height: 100%;

    overflow-y: auto;

    position: sticky;
    top: 0;

    align-self: stretch;

    scrollbar-width: thin;
  }

  .filter-column__title {
    margin: 0 0 8px 0;

    color: #0a2c5c;

    font-size: 0.85rem;
    font-weight: 700;
  }


  /* ============================================================
     FILTER PANELS

     Heights are deliberately compact so the sidebar can fit
     comfortably within normal desktop viewports.
     ============================================================ */

  .filter-panel {
    min-width: 0;

    margin-bottom: 10px;

    border: 1px solid #d7dce3;

    border-radius: 6px;

    background: #ffffff;

    overflow: hidden;
  }

  .filter-panel:last-child {
    margin-bottom: 0;
  }

  .filter-panel__header {
    padding: 7px 10px;

    background: #f7f9fb;

    border-bottom: 1px solid #d7dce3;

    color: #1c2b3a;

    font-size: 0.72rem;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.04em;
  }


  /* ============================================================
     SELECTED FILTER
     ============================================================ */

  .filter-selected {
    min-height: 34px;

    display: flex;
    align-items: center;

    padding: 5px 8px;

    border-bottom: 1px solid #e5e8ec;

    background: #ffffff;
  }

  .filter-selected.is-empty {
    color: #8a96a3;

    font-size: 0.72rem;
  }


  /* ============================================================
     FILTER OPTIONS

     The options area is constrained using viewport height.
     ============================================================ */

  .filter-options {
    max-height: 15vh;

    overflow-y: auto;

    padding: 5px;

    scrollbar-width: thin;
  }

  .filter-option {
    display: block;

    width: 100%;

    margin: 0;

    padding: 5px 7px;

    border: 0;

    border-radius: 4px;

    background: transparent;

    color: #1c2b3a;

    text-align: left;

    font-family: inherit;

    font-size: 0.75rem;

    line-height: 1.2;

    cursor: pointer;
  }

  .filter-option:hover {
    background-color: #eef1f5;
  }

  .filter-option.selected {
    display: none;
  }

  .filter-option:focus-visible {
    outline: 2px solid #7fd6ff;

    outline-offset: -2px;
  }


  /* ============================================================
     SELECTED FILTER PILL
     ============================================================ */

  .filter-pill {
    display: inline-flex;

    align-items: center;

    gap: 6px;

    max-width: 100%;

    background-color: #0a2c5c;

    color: #ffffff;

    border: 1px solid #0a2c5c;

    border-radius: 999px;

    padding: 4px 8px 4px 10px;

    font-size: 0.72rem;

    font-weight: 600;

    line-height: 1.2;
  }

  .filter-pill > span:first-child {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
  }

  .filter-pill__close {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    flex: 0 0 auto;

    width: 15px;
    height: 15px;

    border: 0;

    padding: 0;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.18);

    color: #ffffff;

    font-size: 0.8rem;

    line-height: 1;

    cursor: pointer;
  }

  .filter-pill__close:hover {
    background: rgba(255, 255, 255, 0.32);
  }


  /* ============================================================
     CHANGE FILTER
     ============================================================ */

  .change-filter {
    display: flex;

    align-items: center;

    gap: 6px;

    margin-bottom: 10px;

    flex-wrap: wrap;
  }

  .change-filter__label {
    color: #5a6a7a;

    font-size: 0.75rem;

    font-weight: 600;

    margin-right: 2px;
  }

  .change-filter__pill {
    display: inline-flex;

    align-items: center;

    gap: 5px;

    padding: 4px 9px 4px 6px;

    border: 1px solid #d7dce3;

    border-radius: 999px;

    background: #ffffff;

    color: #1c2b3a;

    font-family: inherit;

    font-size: 0.75rem;

    font-weight: 600;

    cursor: pointer;

    transition:
      background-color 0.15s ease,
      border-color 0.15s ease;
  }

  .change-filter__pill:hover {
    background-color: #f7f9fb;

    border-color: #b8c0ca;
  }

  .change-filter__pill:focus-visible {
    outline: 2px solid #7fd6ff;

    outline-offset: 2px;
  }


  /* ============================================================
     CHANGE ICONS

     Explicit SVG sizing is important here.
     ============================================================ */

  .change-filter__icon {
    display: block !important;

    width: 17px !important;
    height: 17px !important;

    min-width: 17px;
    min-height: 17px;

    max-width: 17px;
    max-height: 17px;

    flex: 0 0 17px;

    overflow: visible;
  }

  .change-filter__icon .change-icon__circle {
    fill: var(--change-color);
  }

  .change-filter__icon .change-icon__symbol {
    fill: none;

    stroke: #ffffff;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
  }


  /* ============================================================
     ICON COLORS
     ============================================================ */

  .change-increase {
    --change-color: #2e8b57;
  }

  .change-decrease {
    --change-color: #c0392b;
  }

  .change-no-change {
    --change-color: #7a8794;
  }


  /* ============================================================
     RIGHT TABLE COLUMN

     Critical: min-height: 0 allows the table to occupy only
     the available viewport height.
     ============================================================ */

  .table-column {
    min-width: 0;
    min-height: 0;

    height: 100%;

    display: flex;
    flex-direction: column;
  }


  /* ============================================================
     LOAD STATUS
     ============================================================ */

  #load-status {
    font-size: 0.8rem;

    color: #5a6a7a;

    margin-bottom: 7px;

    flex-shrink: 0;
  }

  #load-status.error {
    color: #a33;
  }


  /* ============================================================
     WARNING
     ============================================================ */

  #spec-warning {
    display: none;

    font-size: 0.8rem;

    background-color: #fdf1d8;

    border: 1px solid #f0d99a;

    color: #5c4108;

    border-radius: 4px;

    padding: 7px 10px;

    margin-bottom: 8px;

    flex-shrink: 0;
  }

  #spec-warning.visible {
    display: block;
  }


  /* ============================================================
     DATATABLE CONTROLS

     Preserve the existing DataTables appearance.
     ============================================================ */

  .dataTables_wrapper {
    min-height: 0;

    display: flex;
    flex-direction: column;

    height: 100%;
  }

  .dataTables_filter {
    margin-bottom: 5px;

    flex-shrink: 0;
  }


  /* ============================================================
     TABLE SCROLLING

     The table itself gets the remaining viewport height.
     ============================================================ */

  .dataTables_scroll {
    min-height: 0;

    flex: 1 1 auto;

    display: flex;
    flex-direction: column;
  }

  .dataTables_scrollHead {
    flex-shrink: 0;
  }

  .dataTables_scrollBody {
    min-height: 0;

    flex: 1 1 auto;

    overflow-y: auto !important;

    overflow-x: auto !important;

    border-bottom: 1px solid #d7dce3;
  }


  /* ============================================================
     DATATABLE

     These are your original table styles.
     ============================================================ */

  table.dataTable {
    border-collapse: collapse !important;

    width: 100% !important;

    font-size: 0.85rem;
  }

  table.dataTable thead th {
    background-color: #0a2c5c;

    color: #ffffff;

    border-bottom: none !important;

    white-space: nowrap;
  }

  table.dataTable tbody tr:nth-child(even) {
    background-color: #f7f9fb;
  }

  table.dataTable tbody td {
    white-space: nowrap;

    vertical-align: middle;
  }


  /* ============================================================
     RIGHT-ALIGN NUMERIC VALUE COLUMNS
     ============================================================ */

  table.dataTable th.value-column,
  table.dataTable td.value-column {
    text-align: right;
  }


  /* ============================================================
     PERCENT CHANGE — BOLD
     ============================================================ */

  table.dataTable td.value-column {
    /* leave existing numeric styling intact */
  }


  /* ============================================================
     INDICATOR CELL
     ============================================================ */

  .indicator-cell {
    min-width: 280px;

    white-space: normal;

    line-height: 1.2;
  }

  .indicator-cell__name {
    font-weight: 700;

    color: #1c2b3a;
  }

  .indicator-cell__measurement {
    font-size: .75rem;

    font-weight: 400;

    color: #7a8794;
  }

  .indicator-cell__meta {
    margin-top: 2px;

    color: #7a8794;

    font-size: 0.68rem;

    font-weight: 400;
  }


  /* ============================================================
     CHANGE ICON IN TABLE

     Keep these separate from the filter icons.
     ============================================================ */

  .change-icon-wrapper {
    display: inline-flex;

    width: 22px;
    height: 22px;

    align-items: center;
    justify-content: center;

    vertical-align: middle;

    line-height: 0;
  }

  .change-icon {
    display: block !important;

    width: 20px !important;
    height: 20px !important;

    min-width: 20px;
    min-height: 20px;

    max-width: 20px;
    max-height: 20px;

    flex: 0 0 20px;

    overflow: visible;
  }

  .change-icon .change-icon__circle {
    fill: var(--change-color);
  }

  .change-icon .change-icon__symbol {
    fill: none;

    stroke: #ffffff;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
  }


  /* ============================================================
     RESPONSIVE
     ============================================================ */

  @media (max-width: 800px) {

    html,
    body {
      overflow: auto;
    }

    .table-wrap {
      height: auto;

      min-height: calc(100vh - 52px);

      overflow: visible;
    }

    .content-layout {
      grid-template-columns: 1fr;

      min-height: auto;
    }

    .filter-column {
      position: static;

      height: auto;

      overflow: visible;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .filter-panel {
      margin-bottom: 0;
    }

    .filter-options {
      max-height: 18vh;
    }

    .table-column {
      height: 65vh;
    }

    .dataTables_scrollBody {
      overflow-y: auto !important;
    }
  }


  @media (max-width: 550px) {

    .table-wrap {
      padding: 12px 16px;
    }

    .filter-column {
      display: block;
    }

    .filter-panel {
      margin-bottom: 10px;
    }

    .table-column {
      height: 65vh;
    }

    .change-filter {
      gap: 5px;
    }

    .change-filter__pill {
      padding: 4px 8px 4px 5px;
    }
  }


  /* ============================================================
     SHORT VIEWPORTS

     Further compress filters when the browser window is short.
     ============================================================ */

  @media (min-width: 801px) and (max-height: 750px) {

    .table-wrap {
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .filter-panel {
      margin-bottom: 7px;
    }

    .filter-panel__header {
      padding: 5px 9px;
    }

    .filter-selected {
      min-height: 30px;

      padding: 4px 7px;
    }

    .filter-options {
      max-height: 11vh;

      padding: 4px;
    }

    .filter-option {
      padding: 4px 6px;

      font-size: 0.7rem;
    }

    .change-filter {
      margin-bottom: 6px;
    }
  }


  @media (min-width: 801px) and (max-height: 600px) {

    .topbar {
      height: 44px;
      min-height: 44px;
    }

    .table-wrap {
      height: calc(100vh - 44px);

      padding-top: 8px;
      padding-bottom: 8px;
    }

    .topbar-title {
      font-size: 1rem;
    }

    .filter-panel__header {
      padding: 4px 8px;
    }

    .filter-selected {
      min-height: 27px;
    }

    .filter-options {
      max-height: 9vh;
    }

    .filter-option {
      padding: 3px 5px;

      font-size: 0.68rem;
    }

    .change-filter {
      margin-bottom: 5px;
    }
  }

</style>

</head>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>


<script>


// ============================================================
// COLUMN DISPLAY SPEC
// ============================================================

const COLUMN_DISPLAY_SPEC = [

  'Indicator Name',

  'Current Value Date',

  'Previous Value',

  'Current Value',

  'Current vs Previous Delta (%)'

];


// ============================================================
// COLUMN HEADERS
// ============================================================

const COLUMN_HEADERS = {

  'Current Value Date': 'As of:'

};


// ============================================================
// FILTER FIELDS
// ============================================================

const FILTER_FIELDS = {

  tags: 'Tags',

  frequency: 'Frequency',

  dataSource: 'Source'

};


// ============================================================
// DOM REFERENCES
// ============================================================

const statusEl =
  document.getElementById('load-status');

const warningEl =
  document.getElementById('spec-warning');


const changeSelectedEl =
  document.getElementById('change-selected');

const changeOptionsEl =
  document.getElementById('change-options');


const subcatSelectedEl =
  document.getElementById('subcat-selected');

const subcatOptionsEl =
  document.getElementById('subcat-options');


const frequencySelectedEl =
  document.getElementById('frequency-selected');

const frequencyOptionsEl =
  document.getElementById('frequency-options');


const dataSourceSelectedEl =
  document.getElementById('data-source-selected');

const dataSourceOptionsEl =
  document.getElementById('data-source-options');


// ============================================================
// TABLE / FILTER STATE
// ============================================================

let table = null;

let selectedChange = null;

let selectedTag = null;

let selectedFrequency = null;

let selectedDataSource = null;

let tagsColumnIndex = null;

let frequencyColumnIndex = null;

let dataSourceColumnIndex = null;

let percentChangeColumnIndex = null;

let changeColumnIndex = null;

let normalizedToActual = {};


// ============================================================
// HEADER NORMALIZATION
// ============================================================

function normalizeHeader(name) {

  return name
    .trim()
    .replace(/\s+/g, ' ')
    .toLowerCase();

}


// ============================================================
// PARSE PERCENT VALUE
// ============================================================

function parsePercentValue(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return null;
  }

  const numeric =
    parseFloat(
      String(value)
        .replace(/,/g, '')
        .replace('%', '')
        .trim()
    );

  return isNaN(numeric)
    ? null
    : numeric;

}


// ============================================================
// CHECK WHETHER VALUE IS NUMERIC
// ============================================================

function isNumericValue(value) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ) {
    return false;
  }

  return /^-?\d+(?:\.\d+)?$/.test(
    String(value)
      .trim()
      .replace(/,/g, '')
  );

}


// ============================================================
// FORMAT NUMERIC TABLE VALUES
// ============================================================

function formatNumericValue(value) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ) {
    return value || '';
  }

  const stringValue =
    String(value).trim();

  if (!isNumericValue(stringValue)) {
    return value;
  }

  const numericValue =
    parseFloat(
      stringValue.replace(/,/g, '')
    );

  if (isNaN(numericValue)) {
    return value;
  }

  return numericValue.toLocaleString(
    'en-US',
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  );

}


// ============================================================
// DETERMINE WHETHER INDICATOR IS A PERCENT
// ============================================================

function isPercentMeasurement(row) {

  const measurementField =
    normalizedToActual[
      normalizeHeader(
        'Indicator Measurement'
      )
    ];

  if (!measurementField) {
    return false;
  }

  const measurement =
    String(
      row[measurementField] || ''
    );

  return /percent/i.test(
    measurement
  );

}


// ============================================================
// FORMAT VALUE / PERCENT
// ============================================================

function formatValue(
  value,
  row,
  appendPercent
) {

  const formatted =
    formatNumericValue(value);

  if (
    appendPercent &&
    isNumericValue(value) &&
    isPercentMeasurement(row)
  ) {
    return formatted + '%';
  }

  return formatted;

}


// ============================================================
// DATATABLES ABSOLUTE-VALUE SORTING
// ============================================================

$.fn.dataTable.ext.type.order[
  'absolute-percent-pre'
] = function (data) {

  const value =
    parsePercentValue(data);

  if (value === null) {
    return -Infinity;
  }

  return Math.abs(value);

};


// ============================================================
// DETERMINE CHANGE DIRECTION
// ============================================================

function getChangeDirection(row) {

  const previousField =
    normalizedToActual[
      normalizeHeader(
        'Previous Value'
      )
    ];

  const currentField =
    normalizedToActual[
      normalizeHeader(
        'Current Value'
      )
    ];

  if (
    !previousField ||
    !currentField
  ) {
    return null;
  }

  const previous =
    row[previousField];

  const current =
    row[currentField];

  if (
    !isNumericValue(previous) ||
    !isNumericValue(current)
  ) {
    return null;
  }

  const previousNumber =
    parseFloat(
      String(previous)
        .replace(/,/g, '')
    );

  const currentNumber =
    parseFloat(
      String(current)
        .replace(/,/g, '')
    );


  if (
    currentNumber >
    previousNumber * 1.1
  ) {
    return 'increase';
  }


  if (
    currentNumber <
    previousNumber * 0.9
  ) {
    return 'decrease';
  }


  return 'no-change';

}


// ============================================================
// CHANGE ICON HTML
// ============================================================

function getChangeIcon(direction) {

  let colorClass = '';
  let ariaLabel = '';
  let path = '';


  if (direction === 'increase') {

    colorClass = 'change-increase';
    ariaLabel = 'Increasing';

    path =
      'M7 16L16 7M10 7H16V13';

  }


  else if (direction === 'decrease') {

    colorClass = 'change-decrease';
    ariaLabel = 'Decreasing';

    path =
      'M7 8L16 17M10 17H16V11';

  }


  else {

    colorClass = 'change-no-change';
    ariaLabel = 'No change';

    path =
      'M7 12H17';

  }


  return `

    <span class="change-icon-wrapper">

      <svg
        class="change-icon ${colorClass}"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-label="${ariaLabel}"
        role="img"
      >

        <circle
          class="change-icon__circle"
          cx="12"
          cy="12"
          r="10"
        ></circle>

        <path
          class="change-icon__symbol"
          d="${path}"
        ></path>

      </svg>

    </span>

  `;

}


// ============================================================
// CHANGE FILTER ICON HTML
// ============================================================

function getChangeFilterIcon(direction) {

  return getChangeIcon(direction);

}


// ============================================================
// APPLY FILTERS
// ============================================================

function applyFilters() {

  if (!table) {
    return;
  }


  // ----------------------------------------------------------
  // Change
  // ----------------------------------------------------------

  if (
    changeColumnIndex !== null &&
    selectedChange
  ) {

    const directionRegex =
      '^' +
      selectedChange +
      '$';

    table
      .column(changeColumnIndex)
      .search(
        directionRegex,
        true,
        false
      );

  }

  else if (
    changeColumnIndex !== null
  ) {

    table
      .column(changeColumnIndex)
      .search('');

  }


  // ----------------------------------------------------------
  // Tags
  // ----------------------------------------------------------

  if (
    tagsColumnIndex !== null &&
    selectedTag
  ) {

    const escaped =
      $.fn.dataTable.util.escapeRegex(
        selectedTag
      );

    table
      .column(tagsColumnIndex)
      .search(
        '(^|,\\s*)' +
        escaped +
        '(\\s*,|$)',
        true,
        false
      );

  }

  else if (
    tagsColumnIndex !== null
  ) {

    table
      .column(tagsColumnIndex)
      .search('');

  }


  // ----------------------------------------------------------
  // Frequency
  // ----------------------------------------------------------

  if (
    frequencyColumnIndex !== null &&
    selectedFrequency
  ) {

    const escaped =
      $.fn.dataTable.util.escapeRegex(
        selectedFrequency
      );

    table
      .column(frequencyColumnIndex)
      .search(
        '^' + escaped + '$',
        true,
        false
      );

  }

  else if (
    frequencyColumnIndex !== null
  ) {

    table
      .column(frequencyColumnIndex)
      .search('');

  }


  // ----------------------------------------------------------
  // Source
  // ----------------------------------------------------------

  if (
    dataSourceColumnIndex !== null &&
    selectedDataSource
  ) {

    const escaped =
      $.fn.dataTable.util.escapeRegex(
        selectedDataSource
      );

    table
      .column(dataSourceColumnIndex)
      .search(
        '^' + escaped + '$',
        true,
        false
      );

  }

  else if (
    dataSourceColumnIndex !== null
  ) {

    table
      .column(dataSourceColumnIndex)
      .search('');

  }


  table.draw();

}


// ============================================================
// RENDER SELECTED FILTER
// ============================================================

function renderSelectedFilter(
  selectedValue,
  selectedEl,
  emptyText,
  onClear,
  displayLabel
) {

  selectedEl.innerHTML = '';

  if (!selectedValue) {

    selectedEl.classList.add(
      'is-empty'
    );

    selectedEl.textContent =
      emptyText;

    return;

  }


  selectedEl.classList.remove(
    'is-empty'
  );


  const pill =
    document.createElement('span');

  pill.className =
    'filter-pill';


  const label =
    document.createElement('span');

  label.textContent =
    displayLabel || selectedValue;


  const close =
    document.createElement('button');

  close.type = 'button';

  close.className =
    'filter-pill__close';

  close.setAttribute(
    'aria-label',
    'Clear filter'
  );

  close.innerHTML =
    '&times;';


  close.addEventListener(
    'click',
    function () {

      onClear();

    }
  );


  pill.appendChild(label);

  pill.appendChild(close);

  selectedEl.appendChild(pill);

}


// ============================================================
// RENDER NORMAL FILTER OPTIONS
// ============================================================

function renderFilterOptions(
  values,
  optionsEl,
  selectedValue,
  onSelect
) {

  optionsEl.innerHTML = '';


  values.forEach(
    function (value) {

      const button =
        document.createElement('button');

      button.type = 'button';

      button.className =
        'filter-option';


      if (
        value === selectedValue
      ) {

        button.classList.add(
          'selected'
        );

      }


      button.textContent =
        value;


      button.addEventListener(
        'click',
        function () {

          onSelect(value);

        }
      );


      optionsEl.appendChild(
        button
      );

    }
  );

}


// ============================================================
// RENDER CHANGE FILTER OPTIONS
// ============================================================

function renderChangeFilterOptions() {

  const options = [

    {
      value: 'increase',
      label: 'Increasing'
    },

    {
      value: 'decrease',
      label: 'Decreasing'
    },

    {
      value: 'no-change',
      label: 'No change'
    }

  ];


  changeOptionsEl.innerHTML = '';


  options.forEach(
    function (option) {

      const button =
        document.createElement('button');

      button.type = 'button';

      button.className =
        'filter-option change-filter-option';


      if (
        option.value === selectedChange
      ) {

        button.classList.add(
          'selected'
        );

      }


      button.innerHTML =

        getChangeFilterIcon(
          option.value
        ) +

        `<span>${option.label}</span>`;


      button.addEventListener(
        'click',
        function () {

          selectedChange =
            option.value;


          renderChangeFilter();


          applyFilters();

        }
      );


      changeOptionsEl.appendChild(
        button
      );

    }
  );

}


// ============================================================
// RENDER CHANGE FILTER
// ============================================================

function renderChangeFilter() {

  let displayLabel = null;


  if (
    selectedChange === 'increase'
  ) {

    displayLabel =
      'Increasing';

  }

  else if (
    selectedChange === 'decrease'
  ) {

    displayLabel =
      'Decreasing';

  }

  else if (
    selectedChange === 'no-change'
  ) {

    displayLabel =
      'No change';

  }


  renderSelectedFilter(

    selectedChange,

    changeSelectedEl,

    'No change filter selected',

    function () {

      selectedChange = null;

      renderChangeFilter();

      applyFilters();

    },

    displayLabel

  );


  renderChangeFilterOptions();

}


// ============================================================
// BUILD FILTER
// ============================================================

function buildFilter(
  values,
  optionsEl,
  selectedEl,
  emptyText,
  getSelected,
  setSelected
) {

  function render() {

    const currentValue =
      getSelected();


    renderSelectedFilter(

      currentValue,

      selectedEl,

      emptyText,

      function () {

        setSelected(null);

        render();

        applyFilters();

      }

    );


    renderFilterOptions(

      values,

      optionsEl,

      currentValue,

      function (value) {

        setSelected(value);

        render();

        applyFilters();

      }

    );

  }


  render();

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

  return String(
    value == null ? '' : value
  )

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


// ============================================================
// LOAD CSV
// ============================================================

Papa.parse(

  'mock-data-summary-rev.csv',

  {

    download: true,

    header: true,

    skipEmptyLines: true,


    complete: function (results) {


      // ------------------------------------------------------
      // Validate CSV
      // ------------------------------------------------------

      if (
        !results.data.length ||
        !results.meta.fields ||
        !results.meta.fields.length
      ) {

        statusEl.textContent =
          'mock-data-summary.csv loaded, but no rows were found.';

        statusEl.classList.add(
          'error'
        );

        return;

      }


      const csvFields =
        results.meta.fields;


      // ------------------------------------------------------
      // Normalized header lookup
      // ------------------------------------------------------

      normalizedToActual = {};


      csvFields.forEach(
        function (field) {

          normalizedToActual[
            normalizeHeader(field)
          ] = field;

        }
      );


      // ------------------------------------------------------
      // Filter fields
      // ------------------------------------------------------

      const tagsField =
        normalizedToActual[
          normalizeHeader(
            FILTER_FIELDS.tags
          )
        ];


      const frequencyField =
        normalizedToActual[
          normalizeHeader(
            FILTER_FIELDS.frequency
          )
        ];


      const dataSourceField =
        normalizedToActual[
          normalizeHeader(
            FILTER_FIELDS.dataSource
          )
        ];


      // ------------------------------------------------------
      // Table columns
      // ------------------------------------------------------

      const matchedColumns = [];

      const unmatchedSpecEntries = [];


      COLUMN_DISPLAY_SPEC.forEach(
        function (specName) {


          const actualField =
            normalizedToActual[
              normalizeHeader(specName)
            ];


          if (!actualField) {

            unmatchedSpecEntries.push(
              specName
            );

            return;

          }


          // --------------------------------------------------
          // Indicator
          // --------------------------------------------------

          if (
            specName === 'Indicator Name'
          ) {

            matchedColumns.push({

              title:
                COLUMN_HEADERS[actualField] ||
                'Indicator',

              data: actualField,


              render: function (
                data,
                type,
                row
              ) {

                if (
                  type !== 'display'
                ) {

                  return data || '';

                }


                const dateField =
                  normalizedToActual[
                    normalizeHeader(
                      'Current Value Date'
                    )
                  ];


                const dataByField =
                  normalizedToActual[
                    normalizeHeader(
                      'Data by'
                    )
                  ];


                const measurementField =
                  normalizedToActual[
                    normalizeHeader(
                      'Indicator Measurement'
                    )
                  ];


                const measurement =
                  measurementField
                    ? row[measurementField] || ''
                    : '';


                const updated =
                  dateField
                    ? row[dateField] || ''
                    : '';


                const dataBy =
                  dataByField
                    ? row[dataByField] || ''
                    : '';


                return `

                  <div class="indicator-cell">

                    <div class="indicator-cell__name">

                      ${escapeHtml(data || '')}

                      <br>

                      <span class="indicator-cell__measurement">

                        ${escapeHtml(measurement)}

                      </span>

                    </div>


                    <div class="indicator-cell__meta">

                      ${dataBy
                        ? `Data by: ${escapeHtml(dataBy)}`
                        : ''}

                    </div>

                  </div>

                `;

              }

            });


            return;

          }


          // --------------------------------------------------
          // Previous Value / Current Value
          // --------------------------------------------------

          if (
            specName === 'Previous Value' ||
            specName === 'Current Value'
          ) {

            matchedColumns.push({

              title:
                COLUMN_HEADERS[actualField] ||
                specName,

              data: actualField,

              className: 'value-column',


              render: function (
                data,
                type,
                row
              ) {

                if (
                  type !== 'display'
                ) {

                  return data || '';

                }


                return formatValue(
                  data,
                  row,
                  true
                );

              }

            });


            return;

          }


          // --------------------------------------------------
          // Percent Change
          // --------------------------------------------------

          if (
            specName ===
            'Current vs Previous Delta (%)'
          ) {


            // ------------------------------------------------
            // Change direction column
            // ------------------------------------------------

            changeColumnIndex =
              matchedColumns.length;


            matchedColumns.push({

              title: 'Change',

              data: null,

              className:
                'value-column change-column',


              render: function (
                data,
                type,
                row
              ) {

                const direction =
                  getChangeDirection(row);


                if (
                  type === 'filter' ||
                  type === 'sort' ||
                  type === 'type'
                ) {

                  return direction || '';

                }


                if (!direction) {

                  return '';

                }


                return getChangeIcon(
                  direction
                );

              }

            });


            // ------------------------------------------------
            // Percent Change
            // ------------------------------------------------

            percentChangeColumnIndex =
              matchedColumns.length;


            matchedColumns.push({

              title:
                COLUMN_HEADERS[actualField] ||
                'Percent change',

              data: actualField,

              type: 'absolute-percent',

              className: 'value-column percent-change-column',


              render: function (
                data,
                type
              ) {

                if (
                  type !== 'display'
                ) {

                  return data || '';

                }


                if (
                  !isNumericValue(data)
                ) {

                  return data || '';

                }


                return (

                  formatNumericValue(data) +
                  '%'

                );

              }

            });


            return;

          }


          // --------------------------------------------------
          // Other columns
          // --------------------------------------------------

          matchedColumns.push({

            title:
              COLUMN_HEADERS[actualField] ||
              specName,

            data: actualField

          });

        }
      );


      // ------------------------------------------------------
      // Hidden Tags column
      // ------------------------------------------------------

      if (tagsField) {

        tagsColumnIndex =
          matchedColumns.length;


        matchedColumns.push({

          title: 'Tags',

          data: tagsField,

          visible: false,

          searchable: true

        });

      }

      else {

        unmatchedSpecEntries.push(

          FILTER_FIELDS.tags +
          ' (filter)'

        );

      }


      // ------------------------------------------------------
      // Hidden Frequency column
      // ------------------------------------------------------

      if (frequencyField) {

        frequencyColumnIndex =
          matchedColumns.length;


        matchedColumns.push({

          title: 'Frequency',

          data: frequencyField,

          visible: false,

          searchable: true

        });

      }

      else {

        unmatchedSpecEntries.push(

          FILTER_FIELDS.frequency +
          ' (filter)'

        );

      }


      // ------------------------------------------------------
      // Hidden Source column
      // ------------------------------------------------------

      if (dataSourceField) {

        dataSourceColumnIndex =
          matchedColumns.length;


        matchedColumns.push({

          title: 'Source',

          data: dataSourceField,

          visible: false,

          searchable: true

        });

      }

      else {

        unmatchedSpecEntries.push(

          FILTER_FIELDS.dataSource +
          ' (filter)'

        );

      }


      // ------------------------------------------------------
      // Warning
      // ------------------------------------------------------

      if (
        unmatchedSpecEntries.length
      ) {

        warningEl.textContent =

          'Warning: these columns were not found in the CSV header: ' +

          unmatchedSpecEntries.join(', ');

        warningEl.classList.add(
          'visible'
        );

      }


      // ------------------------------------------------------
      // Validate table columns
      // ------------------------------------------------------

      if (
        !matchedColumns.length
      ) {

        statusEl.textContent =

          'None of the columns in COLUMN_DISPLAY_SPEC matched the CSV header.';

        statusEl.classList.add(
          'error'
        );

        return;

      }


      // ======================================================
      // INITIALIZE DATATABLE
      // ======================================================

      table =
        $('#summary-table').DataTable({

          data: results.data,

          columns: matchedColumns,

          deferRender: true,

          scrollX: true,

          scrollY: true,


          /*
             No pagination
          */

          paging: false,

          lengthChange: false,

          info: false,


          /*
             Default order:
             largest absolute Percent Change first.
          */

          order: [

            [
              percentChangeColumnIndex,
              'desc'
            ]

          ]

        });


      statusEl.style.display =
        'none';


      // ======================================================
      // CHANGE FILTER
      // ======================================================

      renderChangeFilter();


      // ======================================================
      // TAGS FILTER
      // ======================================================

      if (tagsField) {

        const values =
          Array.from(

            new Set(

              results.data

                .flatMap(
                  function (row) {

                    return String(
                      row[tagsField] || ''
                    )

                      .split(',')

                      .map(
                        function (tag) {

                          return tag.trim();

                        }
                      )

                      .filter(
                        function (tag) {

                          return tag.length > 0;

                        }
                      );

                  }
                )

            )

          ).sort(
            function (a, b) {

              return a.localeCompare(b);

            }
          );


        buildFilter(

          values,

          subcatOptionsEl,

          subcatSelectedEl,

          'No tag selected',

          function () {

            return selectedTag;

          },

          function (value) {

            selectedTag =
              value;

          }

        );

      }


      // ======================================================
      // FREQUENCY FILTER
      // ======================================================

      if (frequencyField) {

        const values =
          Array.from(

            new Set(

              results.data

                .map(
                  function (row) {

                    return (
                      row[frequencyField] || ''
                    ).trim();

                  }
                )

                .filter(
                  function (value) {

                    return value.length > 0;

                  }
                )

            )

          ).sort(
            function (a, b) {

              return a.localeCompare(b);

            }
          );


        buildFilter(

          values,

          frequencyOptionsEl,

          frequencySelectedEl,

          'No frequency selected',

          function () {

            return selectedFrequency;

          },

          function (value) {

            selectedFrequency =
              value;

          }

        );

      }


      // ======================================================
      // SOURCE FILTER
      // ======================================================

      if (dataSourceField) {

        const values =
          Array.from(

            new Set(

              results.data

                .map(
                  function (row) {

                    return (
                      row[dataSourceField] || ''
                    ).trim();

                  }
                )

                .filter(
                  function (value) {

                    return value.length > 0;

                  }
                )

            )

          ).sort(
            function (a, b) {

              return a.localeCompare(b);

            }
          );


        buildFilter(

          values,

          dataSourceOptionsEl,

          dataSourceSelectedEl,

          'No source selected',

          function () {

            return selectedDataSource;

          },

          function (value) {

            selectedDataSource =
              value;

          }

        );

      }

    },


    // ========================================================
    // CSV ERROR
    // ========================================================

    error: function (err) {

      statusEl.textContent =

        'Could not load mock-data-summary-rev.csv: ' +

        err.message;

      statusEl.classList.add(
        'error'
      );

    }

  }

);

</script>
